services:
  figcraft-web:
    image: nginx:alpine
    container_name: figcraft-web
    restart: always
    ports:
      - "18767:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

