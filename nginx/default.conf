server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html buka.html galeri.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/wasm
        application/javascript
        text/javascript
        text/css
        text/plain
        application/json
        image/svg+xml;

    # Hashed static assets: cache forever
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # Fonts
    location ~* \.(ttf|woff|woff2|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # HTML files: no-cache so updates load immediately
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # Dynamic preview files (.figcraft, .png, proyek.json)
    location /pratinjau/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # API jembatan FigCraft (simpan desain manual, render, dsb)
    location /api/ {
        proxy_pass http://host.docker.internal:8794/;
        # Ganti dengan X-Api-Key yang sesuai dengan konfigurasi backend Anda
        proxy_set_header X-Api-Key "YOUR_API_KEY_HERE";
        proxy_set_header Host $host;
        client_max_body_size 50m;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        try_files $uri $uri/ =404;
    }
}

