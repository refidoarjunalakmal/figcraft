<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri Riwayat Desain — FigCraft INTEK</title>
  <style>
    :root {
      --primary: #D3001A;
      --primary-hover: #b00015;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      background: var(--primary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 600px;
      justify-content: flex-end;
    }
    .search-box {
      position: relative;
      width: 100%;
      max-width: 380px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 14px 8px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover { background: #475569; }
    main {
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
    }
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .meta-count { font-size: 15px; color: var(--text-muted); }
    .meta-count strong { color: var(--text); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #64748b;
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.4);
    }
    .thumb-wrap {
      width: 100%;
      height: 190px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.3s;
    }
    .card:hover .thumb-wrap img {
      transform: scale(1.03);
    }
    .thumb-empty {
      font-size: 40px;
      opacity: 0.4;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .card-file {
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-actions {
      display: flex;
      gap: 8px;
    }
    .card-actions .btn {
      flex: 1;
      justify-content: center;
      padding: 8px 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <a href="./" class="brand">
      <div class="brand-logo">🎨</div>
      <div>
        <div class="brand-title">FigCraft Galeri</div>
        <div class="brand-sub">INTEK Design System &amp; AI Workspace</div>
      </div>
    </a>
    <div class="header-actions">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari proyek (mobile, dashboard, brosur)...">
      </div>
      <a href="./" class="btn btn-secondary">← Kanvas Editor</a>
    </div>
  </header>

  <main>
    <div class="meta-bar">
      <div class="meta-count">Menampilkan <strong id="totalCount">0</strong> desain dari harddisk server</div>
      <div style="font-size: 13px; color: var(--text-muted);">
        Terhubung ke <code style="background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px;">172.15.50.14:18767</code>
      </div>
    </div>
    <div class="grid" id="grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-muted);">Memuat riwayat proyek...</div>
    </div>
  </main>

  <script>
    let allProjects = [];

    async function load() {
      try {
        const res = await fetch('./pratinjau/proyek.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allProjects = data.projects || [];
        document.getElementById('totalCount').textContent = allProjects.length;
        render(allProjects);
      } catch (e) {
        document.getElementById('grid').innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px; color: #ef4444;">
            Gagal memuat proyek.json: ${e.message}
          </div>
        `;
      }
    }

    function render(list) {
      const grid = document.getElementById('grid');
      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-muted);">Tidak ada proyek yang sesuai pencarian.</div>`;
        return;
      }
      grid.innerHTML = list.map(p => {
        const thumb = p.png
          ? `<img src="${p.png}" alt="${p.nama}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=thumb-empty>🎨</span>'">`
          : `<span class="thumb-empty">🎨</span>`;

        return `
          <div class="card">
            <div class="thumb-wrap">${thumb}</div>
            <div class="card-body">
              <div>
                <div class="card-title">${p.judul}</div>
                <div class="card-file" title="${p.nama}">${p.nama}</div>
              </div>
              <div class="card-meta">
                <span>🕒 ${p.tanggal}</span>
                <span>${(p.size / 1024).toFixed(1)} KB</span>
              </div>
              <div class="card-actions">
                <a href="${p.buka_url}" class="btn">🚀 Buka di Editor</a>
                ${p.png ? `<a href="${p.png}" target="_blank" class="btn btn-secondary" title="Pratinjau PNG">🖼️</a>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = allProjects.filter(p =>
        p.proyek.toLowerCase().includes(q) ||
        p.nama.toLowerCase().includes(q) ||
        p.tanggal.toLowerCase().includes(q)
      );
      document.getElementById('totalCount').textContent = filtered.length;
      render(filtered);
    });

    load();
  </script>
</body>
</html>
